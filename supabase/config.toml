project_id = "pz-autos"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Single-owner product: nobody else may ever create an account. The owner is
# provisioned once via the Supabase dashboard/CLI, not through the app.
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "10MiB"
